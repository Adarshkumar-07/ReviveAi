name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency scanner
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Secret pattern scan
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git --exclude='*.lock' --exclude='security.yml' '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----)' .
      - name: Verify no tracked environment files
        run: |
          test -z "$(git ls-files | grep -E '(^|/)\.env($|\.)' || true)"
